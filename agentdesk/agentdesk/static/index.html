<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--text:#1d2330;--muted:#667085;--border:#dde1e7;
  --accent:#3563e9;--accent-text:#fff;--danger:#d92d20;--warn:#c4720a;--ok:#12805c;
  --note:#fff8e1;--note-border:#f3d27a;--agent:#eef3ff;--agent-border:#b9c9f7;--fb:#ecfdf3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b;--panel:#1a1e26;--panel2:#222733;--text:#e6e8ec;--muted:#98a2b3;--border:#2d3340;
  --accent:#6b8cff;--accent-text:#0b1020;--danger:#f97066;--warn:#fdb022;--ok:#32d583;
  --note:#2a2414;--note-border:#6b5520;--agent:#18213a;--agent-border:#34477a;--fb:#112a1f;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#12151b;--panel:#1a1e26;--panel2:#222733;--text:#e6e8ec;--muted:#98a2b3;--border:#2d3340;
  --accent:#6b8cff;--accent-text:#0b1020;--danger:#f97066;--warn:#fdb022;--ok:#32d583;
  --note:#2a2414;--note-border:#6b5520;--agent:#18213a;--agent-border:#34477a;--fb:#112a1f;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:80px}
button{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.small{padding:2px 8px;font-size:12px}
.layout{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--border);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;font-size:16px;padding:4px 10px 14px}
nav a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px;color:var(--text)}
nav a.active,nav a:hover{background:var(--panel2);text-decoration:none}
nav .count{background:var(--accent);color:var(--accent-text);border-radius:10px;padding:0 7px;font-size:12px}
main{min-width:0}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header input[type=search]{max-width:360px}
header .spacer{flex:1}
header label{display:flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
header select{width:auto}
.content{padding:16px;max-width:1400px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile .n{font-size:26px;font-weight:700}.tile .l{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--border);background:var(--panel2);white-space:nowrap}
.s-new{color:#7a5af8}.s-open{color:var(--accent)}.s-in_progress{color:var(--warn)}.s-waiting_info,.s-on_hold{color:#dd2590}
.s-resolved{color:var(--ok)}.s-closed,.s-cancelled{color:var(--muted)}
.p1{color:var(--danger);font-weight:700}.p2{color:var(--warn);font-weight:600}
.muted{color:var(--muted)}.right{text-align:right}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{width:auto}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:16px}.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.fields label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.timeline{display:flex;flex-direction:column;gap:8px}
.entry{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--panel)}
.entry.work_note{background:var(--note);border-color:var(--note-border)}
.entry.agent_output{background:var(--agent);border-color:var(--agent-border)}
.entry.feedback{background:var(--fb)}
.entry.system,.entry.history{background:transparent;border-style:dashed;color:var(--muted);font-size:12px;padding:4px 10px}
.entry .meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px}
.md p{margin:.3em 0}.md pre{background:var(--panel2);padding:8px;border-radius:6px;overflow:auto;max-height:420px}
.md code{background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12.5px}.md pre code{padding:0;background:none}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{border:1px solid var(--border);border-radius:6px;padding:4px;font-size:12px;max-width:140px;word-break:break-all}
.att img{display:block;max-width:130px;max-height:90px;border-radius:4px;margin-bottom:2px}
.drop{outline:2px dashed var(--accent);outline-offset:2px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel2);border-radius:8px;padding:8px;min-height:200px}
.col h2{display:flex;justify-content:space-between}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;cursor:grab}
.kcard .k{font-size:12px;color:var(--muted)}
.col.over{outline:2px dashed var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20}
.modal{background:var(--panel);border-radius:10px;padding:16px;width:min(640px,100%);max-height:88vh;overflow:auto;border:1px solid var(--border)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:30;max-width:420px}
.toast.err{background:var(--danger);color:#fff}
.stars button{border:none;background:none;font-size:22px;padding:0 2px;color:var(--warn)}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.progress div{height:100%;background:var(--ok)}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px}nav .brand{width:100%}
  .detail{grid-template-columns:1fr}header{flex-wrap:wrap}.form .two{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav">
    <div class="brand">🎫 AgentDesk</div>
    <a href="#/dashboard" data-v="dashboard">Dashboard</a>
    <a href="#/tickets" data-v="tickets">Tickets</a>
    <a href="#/board" data-v="board">Board</a>
    <a href="#/goals" data-v="goals">Goals</a>
    <a href="#/inbox" data-v="inbox">Inbox <span class="count" id="inboxCount" hidden></span></a>
    <a href="#/kb" data-v="kb">Knowledge</a>
    <a href="#/agents" data-v="agents">Agents &amp; people</a>
    <a href="#/projects" data-v="projects">Projects</a>
    <a href="#/help" data-v="help">Connect an AI</a>
  </nav>
  <main>
    <header>
      <input type="search" id="search" placeholder="Search tickets, comments… (Enter)">
      <button class="primary" id="newBtn">+ New ticket</button>
      <button id="newGoalBtn">+ New goal</button>
      <span class="spacer"></span>
      <label>Acting as <select id="actor"></select></label>
      <button class="small" id="themeBtn" title="Toggle theme">◐</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k, d) { try { return localStorage.getItem(k) ?? d } catch { return d } },
               set(k, v) { try { localStorage.setItem(k, v) } catch {} }};
let META = null, ACTORS = [], PROJECTS = [], lastEvent = 0, current = {view: null, arg: null};
let me = store.get("ad.actor", "user");

async function api(path, opts = {}) {
  const headers = {"X-Actor": me, ...(opts.headers || {})};
  let body = opts.body;
  if (body && !(body instanceof Blob) && !(body instanceof ArrayBuffer)) { body = JSON.stringify(body); headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, {method: opts.method || (body ? "POST" : "GET"), headers, body});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), err ? 6000 : 2500);
}
const guard = fn => async (...a) => { try { return await fn(...a) } catch (e) { toast(e.message, true) } };

// Small, safe markdown: escape first, then format.
function md(src) {
  let s = esc(src);
  const blocks = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, code) => { blocks.push(`<pre><code>${code}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       .replace(/(^|\s)\*([^*\n]+)\*/g, "$1<i>$2</i>")
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\b((?:GOAL|TASK|BUG|INC|REQ|Q|CHG|NOTE)-\d+)\b/g, '<a href="#/t/$1">$1</a>')
       .replace(/(^|\s)@([\w.-]+)/g, '$1<b>@$2</b>')
       .replace(/^#{1,3} (.*)$/gm, "<b>$1</b>")
       .replace(/^[-*] (.*)$/gm, "• $1");
  s = s.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
  return `<div class="md">${s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i])}</div>`;
}
const ago = iso => { if (!iso) return ""; const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s/60)}m ago`; if (s < 86400) return `${Math.floor(s/3600)}h ago`; return `${Math.floor(s/86400)}d ago`; };
const status = s => `<span class="badge s-${s}">${s.replace("_", " ")}</span>`;
const prio = p => `<span class="p${p}">P${p}</span>`;
const kind = n => (ACTORS.find(a => a.name === n) || {}).kind;
const who = n => n ? `${kind(n) === "agent" ? "🤖 " : ""}${esc(n)}` : '<span class="muted">—</span>';
const opt = (v, label, sel) => `<option value="${esc(v)}" ${v == sel ? "selected" : ""}>${esc(label ?? v)}</option>`;
const actorOptions = (sel, blank = "— unassigned —") => opt("", blank, sel) + ACTORS.map(a => opt(a.name, (a.kind === "agent" ? "🤖 " : "") + a.name, sel)).join("");
const projectOptions = (sel, blank = "— none —") => opt("", blank, sel) + PROJECTS.map(p => opt(p.key, `${p.key} · ${p.name}`, sel)).join("");

async function loadRefs() {
  [ACTORS, PROJECTS] = await Promise.all([api("/api/actors"), api("/api/projects")]);
  if (!ACTORS.find(a => a.name === me)) ACTORS.push({name: me, kind: "human"});
  $("#actor").innerHTML = ACTORS.filter(a => a.kind === "human").map(a => opt(a.name, a.name, me)).join("") + opt("__new", "+ other name…");
}

// ------------------------------------------------------------------ views
const views = {};

views.dashboard = async () => {
  const [st, mine, waiting, inbox] = await Promise.all([api("/api/stats"), api("/api/tickets?assignee=me&status=open"),
    api("/api/tickets?status=waiting_info&requester=" + encodeURIComponent(me)), api("/api/inbox")]);
  const tile = (n, l, href) => `<a class="card tile" href="${href}"><div class="n">${n}</div><div class="l">${l}</div></a>`;
  const bs = st.by_status;
  return `<h1>Dashboard</h1>
  <div class="grid tiles">
    ${tile(st.open_total, "Open tickets", "#/tickets")}
    ${tile(bs.new || 0, "New / untriaged", "#/tickets?status=new")}
    ${tile(bs.in_progress || 0, "In progress", "#/tickets?status=in_progress")}
    ${tile(st.waiting_info, "Waiting for info", "#/tickets?status=waiting_info")}
    ${tile(st.sla_breached, "SLA breached", "#/tickets")}
    ${tile(bs.resolved || 0, "Resolved (awaiting close)", "#/tickets?status=resolved")}
    ${tile(st.avg_rating ? st.avg_rating + " ★" : "—", `Avg feedback (${st.rated_count})`, "#/tickets?status=done")}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:16px">
    <div class="card"><h2>Needs your answer</h2>${miniList(waiting, "Nothing is waiting on you.")}</div>
    <div class="card"><h2>Assigned to you</h2>${miniList(mine, "Nothing assigned to you.")}</div>
    <div class="card"><h2>Workload by assignee</h2>${Object.entries(st.open_by_assignee).map(([k, v]) =>
      `<div class="row" style="justify-content:space-between"><a href="#/tickets?assignee=${encodeURIComponent(k === "(unassigned)" ? "none" : k)}">${who(k === "(unassigned)" ? "" : k) || k}</a><b>${v}</b></div>`).join("") || '<div class="muted">No open work.</div>'}</div>
    <div class="card"><h2>Recent notifications</h2>${inbox.slice(0, 8).map(n => `<div><a href="#/t/${n.key}">${esc(n.message)}</a> <span class="muted">${ago(n.created_at)}</span></div>`).join("") || '<div class="muted">Inbox zero.</div>'}</div>
  </div>`;
};
const miniList = (rows, empty) => rows.length ? rows.slice(0, 10).map(t =>
  `<div class="row"><a href="#/t/${t.key}">${t.key}</a> ${status(t.status)} ${esc(t.title)}</div>`).join("") : `<div class="muted">${empty}</div>`;

function ticketTable(rows) {
  if (!rows.length) return `<div class="card empty">No tickets match.</div>`;
  return `<table><thead><tr><th>Key</th><th>Title</th><th>Status</th><th>Pri</th><th class="hide-sm">Type</th><th>Assignee</th><th class="hide-sm">Project</th><th class="hide-sm">Updated</th><th class="hide-sm">SLA</th></tr></thead><tbody>
  ${rows.map(t => `<tr class="click" data-key="${t.key}"><td><a href="#/t/${t.key}">${t.key}</a></td>
    <td>${esc(t.title)}${t.child_count ? ` <span class="muted">(${t.child_count} sub)</span>` : ""}${t.blocked_by.length ? ` <span class="badge" title="blocked by ${t.blocked_by.join(", ")}">⛔ blocked</span>` : ""}${t.claimed_by ? ` <span class="badge" title="claimed">⚑ ${esc(t.claimed_by)}</span>` : ""}</td>
    <td>${status(t.status)}</td><td>${prio(t.priority)}</td><td class="hide-sm">${t.type}</td><td>${who(t.assignee)}</td>
    <td class="hide-sm">${esc(t.project || "")}</td><td class="hide-sm muted">${ago(t.updated_at)}</td>
    <td class="hide-sm">${t.is_open ? (t.sla.breached ? '<span class="p1">breached</span>' : t.sla.paused ? '<span class="muted">paused</span>' : `<span class="muted">${Math.round(t.sla.remaining_seconds / 3600)}h</span>`) : ""}</td></tr>`).join("")}
  </tbody></table>`;
}

views.tickets = async (_, params) => {
  const f = Object.fromEntries(params);
  f.status ??= "open";
  const q = new URLSearchParams(Object.entries(f).filter(([, v]) => v)).toString();
  const rows = await api("/api/tickets?" + q);
  const sel = (name, options) => `<select data-f="${name}">${options}</select>`;
  return `<h1>Tickets</h1>
  <div class="tabs">${["open", "new", "in_progress", "waiting_info", "on_hold", "resolved", "done", "all"].map(s =>
    `<button data-status="${s}" class="${f.status === s ? "on" : ""}">${s.replace("_", " ")}</button>`).join("")}</div>
  <div class="filters">
    ${sel("assignee", opt("", "Any assignee", f.assignee) + opt("me", "Me", f.assignee) + opt("none", "Unassigned", f.assignee) + ACTORS.map(a => opt(a.name, a.name, f.assignee)).join(""))}
    ${sel("type", opt("", "Any type", f.type) + Object.keys(META.types).map(t => opt(t, t, f.type)).join(""))}
    ${sel("project", projectOptions(f.project, "Any project"))}
    ${sel("order", ["priority", "updated", "created", "due"].map(o => opt(o, "Sort: " + o, f.order)).join(""))}
    <input data-f="q" placeholder="Filter text…" value="${esc(f.q || "")}" style="width:200px">
  </div>${ticketTable(rows)}`;
};
function bindTickets(params) {
  const go = changes => { const p = new URLSearchParams(params); for (const [k, v] of Object.entries(changes)) v ? p.set(k, v) : p.delete(k); location.hash = "#/tickets?" + p; };
  $$("[data-status]").forEach(b => b.onclick = () => go({status: b.dataset.status}));
  $$("[data-f]").forEach(el => el.onchange = () => go({[el.dataset.f]: el.value}));
  bindRows();
}
const bindRows = () => $$("tr.click").forEach(tr => tr.onclick = e => { if (e.target.tagName !== "A") location.hash = "#/t/" + tr.dataset.key; });

views.board = async (_, params) => {
  const project = params.get("project") || "";
  const rows = await api("/api/tickets?status=all&limit=500&order=priority" + (project ? "&project=" + project : ""));
  const cols = ["new", "open", "in_progress", "waiting_info", "on_hold", "resolved"];
  return `<div class="row" style="justify-content:space-between"><h1>Board</h1><select id="boardProject" style="width:auto">${projectOptions(project, "All projects")}</select></div>
  <p class="muted">Drag cards between columns to change status.</p>
  <div class="board">${cols.map(c => { const items = rows.filter(t => t.status === c);
    return `<div class="col" data-col="${c}"><h2>${status(c)} <span class="muted">${items.length}</span></h2>
    ${items.map(t => `<div class="kcard" draggable="true" data-key="${t.key}"><div class="k">${t.key} · ${prio(t.priority)} · ${t.type}</div>
      <div><a href="#/t/${t.key}">${esc(t.title)}</a></div><div class="k">${who(t.assignee)}${t.claimed_by ? " ⚑" : ""}</div></div>`).join("")}</div>`; }).join("")}</div>`;
};
function bindBoard() {
  $("#boardProject").onchange = e => location.hash = "#/board?project=" + e.target.value;
  $$(".kcard").forEach(c => c.ondragstart = e => e.dataTransfer.setData("text/plain", c.dataset.key));
  $$(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = guard(async e => {
      e.preventDefault(); col.classList.remove("over");
      const key = e.dataTransfer.getData("text/plain"), st = col.dataset.col;
      if (["resolved", "waiting_info", "on_hold"].includes(st)) return statusDialog(key, st);
      await api(`/api/tickets/${key}/status`, {body: {status: st}}); render();
    });
  });
}

views.goals = async () => {
  const goals = await api("/api/tickets?type=goal&status=all&order=updated");
  const details = await Promise.all(goals.map(g => api("/api/tickets/" + g.key)));
  return `<div class="row" style="justify-content:space-between"><h1>Goals</h1><button class="primary" onclick="newTicket('goal')">+ New goal</button></div>
  <p class="muted">Goals are objectives you hand to your AI agents. A planner agent breaks each goal into subtasks and assigns them; progress rolls up here.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${details.map(g => {
    const done = g.children.filter(c => ["resolved", "closed", "cancelled"].includes(c.status)).length, n = g.children.length;
    return `<div class="card"><div class="row" style="justify-content:space-between"><a href="#/t/${g.key}"><b>${g.key}</b></a>${status(g.status)}</div>
      <h2 style="margin-top:6px">${esc(g.title)}</h2>
      <div class="muted">${who(g.assignee)} · ${esc(g.project || "no project")} · ${ago(g.updated_at)}</div>

function bindTicket() {
  const t = current.ticket;
  let ckind = "comment", pending = [];
  const reload = () => render();
  $$("[data-tl]").forEach(b => b.onclick = () => { tlFilter = b.dataset.tl; render(); });
  $$("[data-to]").forEach(b => b.onclick = () => statusDialog(t.key, b.dataset.to, !!b.dataset.force));
  $$("[data-field]").forEach(el => el.onchange = guard(async () => {
    let v = el.value; if (["priority", "impact", "urgency"].includes(el.dataset.field)) v = +v;
    await api("/api/tickets/" + t.key, {method: "PATCH", body: {[el.dataset.field]: v}}); toast("Saved"); reload();
  }));
  $("#takeBtn") && ($("#takeBtn").onclick = guard(async () => { await api("/api/tickets/" + t.key, {method: "PATCH", body: {assignee: me}}); reload(); }));
  $("#releaseBtn") && ($("#releaseBtn").onclick = guard(async () => { await api(`/api/tickets/${t.key}/release`, {body: {}}); reload(); }));
  $("#watchBtn").onclick = guard(async () => { await api(`/api/tickets/${t.key}/watch`, {body: {on: !t.watchers.includes(me)}}); reload(); });
  $("#editBtn").onclick = () => editDialog(t);
  $("#subBtn") && ($("#subBtn").onclick = () => newTicket("task", {parent: t.key, project: t.project}));
  $("#linkBtn").onclick = guard(async () => { await api(`/api/tickets/${t.key}/links`, {body: {rel: $("#linkRel").value, target: $("#linkTo").value}}); reload(); });
  $$("[data-unlink]").forEach(b => b.onclick = guard(async () => { await api("/api/links/" + b.dataset.unlink, {method: "DELETE"}); reload(); }));
  $$("[data-star]").forEach(b => b.onclick = () => feedbackDialog(t, +b.dataset.star));
  $("#runBtn") && ($("#runBtn").onclick = guard(async () => { const a = $("#runAgent").value;
    await api(`/api/agents/${a}/run`, {body: {ticket: t.key}}); toast(`${a} started on ${t.key}; results will appear here.`); }));
  $("#ctxBtn").onclick = guard(async () => { const {context} = await api(`/api/tickets/${t.key}/context?as=${encodeURIComponent(t.assignee || me)}`);
    try { await navigator.clipboard.writeText(context); toast("Briefing copied — paste it into any AI chat."); }
    catch { modal(`<h2>Agent briefing</h2><textarea style="min-height:50vh">${esc(context)}</textarea>`, []); } });
  if (!$("#composer")) return;
  $$("[data-kind]").forEach(b => b.onclick = () => { ckind = b.dataset.kind; $$("[data-kind]").forEach(x => x.classList.toggle("on", x === b)); });
  const showPending = () => $("#pending").textContent = pending.length ? pending.map(f => f.name).join(", ") : "";
  const addFiles = files => { for (const f of files) pending.push(f.name && f.name !== "image.png" ? f : new File([f], `screenshot-${new Date().toISOString().replace(/[:.]/g, "-")}.png`, {type: f.type})); showPending(); };
  $("#file").onchange = e => addFiles(e.target.files);
  const box = $("#composer");
  $("#body").addEventListener("paste", e => { const files = [...e.clipboardData.files]; if (files.length) { e.preventDefault(); addFiles(files); } });
  box.ondragover = e => { e.preventDefault(); box.classList.add("drop"); };
  box.ondragleave = () => box.classList.remove("drop");
  box.ondrop = e => { e.preventDefault(); box.classList.remove("drop"); addFiles(e.dataTransfer.files); };
  $("#postBtn").onclick = guard(async () => {
    let body = $("#body").value.trim();
    if (!body && !pending.length) return toast("Write something or attach a file", true);
    if (!body) body = "Attached: " + pending.map(f => f.name).join(", ");
    const c = await api(`/api/tickets/${t.key}/comments`, {body: {body, kind: ckind}});
    for (const f of pending) await api(`/api/tickets/${t.key}/attachments?filename=${encodeURIComponent(f.name)}&comment_id=${c.id}&mime=${encodeURIComponent(f.type)}`, {body: f});
    $("#body").value = ""; pending = [];
    reload();
  });
  $("#body").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("#postBtn").click(); };
}

// ------------------------------------------------------------- dialogs
function modal(html, buttons) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal form">${html}<div class="actions">${buttons.map((b, i) => `<button data-i="${i}" class="${b.cls || ""}">${b.label}</button>`).join("")}<button data-close>Close</button></div></div>`;
  document.body.append(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg || e.target.hasAttribute("data-close")) close(); };
  $$("[data-i]", bg).forEach(b => b.onclick = guard(async () => { if (await buttons[+b.dataset.i].fn(bg) !== false) close(); }));
  const first = $("input,textarea,select", bg); first && first.focus();
  return bg;
}
function statusDialog(key, to, force) {
  const needs = {resolved: "Resolution notes (what was done) *", waiting_info: "What information do you need? *", on_hold: "Why is it on hold?", cancelled: "Reason", closed: "Closing note"}[to];
  const go = async bg => {
    const note = bg ? $("#note", bg).value.trim() : "";
    if ((to === "resolved" || to === "waiting_info") && !note) { toast("A note is required", true); return false; }
    await api(`/api/tickets/${key}/status`, {body: {status: to, note: note || null, resolution_code: bg && $("#code", bg) ? $("#code", bg).value : null, force}});
    toast(`${key} → ${to}`); render();
  };
  if (!needs) return guard(go)();
  modal(`<h2>${key} → ${to.replace("_", " ")}</h2>
    ${to === "resolved" ? `<label>Resolution code</label><select id="code">${META.resolution_codes.map(c => opt(c)).join("")}</select>` : ""}
    <label>${needs}</label><textarea id="note"></textarea>`, [{label: "Confirm", cls: "primary", fn: go}]);
}
function feedbackDialog(t, rating) {
  modal(`<h2>Feedback for ${t.key}: ${"★".repeat(rating)}${"☆".repeat(5 - rating)}</h2><label>Comments (optional)</label><textarea id="fb"></textarea>
    <label><input type="checkbox" id="reopen" style="width:auto"> Not fixed — reopen the ticket</label>`,
    [{label: "Submit", cls: "primary", fn: async bg => { await api(`/api/tickets/${t.key}/feedback`, {body: {rating, text: $("#fb", bg).value, reopen: $("#reopen", bg).checked}}); render(); }}]);
}
function editDialog(t) {
  modal(`<h2>Edit ${t.key}</h2><label>Title</label><input id="et" value="${esc(t.title)}"><label>Description (markdown)</label><textarea id="ed" style="min-height:240px">${esc(t.description)}</textarea>`,
    [{label: "Save", cls: "primary", fn: async bg => { await api("/api/tickets/" + t.key, {method: "PATCH", body: {title: $("#et", bg).value, description: $("#ed", bg).value}}); render(); }}]);

function newTicket(type = "task", preset = {}) {

    <label>Description</label><textarea id="nd" style="min-height:${isGoal ? 200 : 120}px" placeholder="${isGoal ? "Context, constraints, definition of done…" : "Steps, expected vs actual, context…"}"></textarea>
    <div class="two"><div><label>Type</label><select id="ntype">${Object.keys(META.types).map(k => opt(k, k, type)).join("")}</select></div>
      <div><label>Project</label><select id="np">${projectOptions(preset.project || store.get("ad.project", ""))}</select></div></div>
    <div class="two"><div><label>Assignee</label><select id="na">${actorOptions(isGoal && planners[0] ? planners[0].name : "")}</select></div>
      <div><label>Queue / group</label><input id="nq" placeholder="optional"></div></div>
    <div class="two"><div><label>Impact</label><select id="ni">${[1, 2, 3].map(i => opt(i, ["", "1 · High", "2 · Medium", "3 · Low"][i], 2)).join("")}</select></div>
      <div><label>Urgency</label><select id="nu">${[1, 2, 3].map(i => opt(i, ["", "1 · High", "2 · Medium", "3 · Low"][i], 2)).join("")}</select></div></div>
    <label>Tags</label><input id="ntags" placeholder="comma separated">
    <label>Attachments</label><input type="file" id="nf" multiple>`,
    [{label: "Create", cls: "primary", fn: async bg => {
      const body = {title: $("#nt", bg).value, description: $("#nd", bg).value, type: $("#ntype", bg).value, project: $("#np", bg).value || null,
        assignee: $("#na", bg).value || null, queue: $("#nq", bg).value, impact: +$("#ni", bg).value, urgency: +$("#nu", bg).value,
        tags: $("#ntags", bg).value, parent: preset.parent || null};

      location.hash = "#/t/" + t.key;
    }}]);
}

  <p class="muted">Agents are local AI models. The runner hands them tickets with a full briefing; they reply on the ticket, create subtasks, @mention each other and document in the knowledge base.</p>
  <table><thead><tr><th>Name</th><th>Kind</th><th>Capabilities</th><th class="hide-sm">Command</th><th>Queue</th><th>Open</th><th class="hide-sm">Last seen</th><th></th></tr></thead><tbody>
  ${actors.map(a => `<tr><td><b>${who(a.name)}</b>${running.includes(a.name) ? ' <span class="badge s-in_progress">running</span>' : ""}${a.enabled ? "" : ' <span class="badge">disabled</span>'}</td><td>${a.kind}</td>
    <td>${esc(a.capabilities || "")}</td><td class="hide-sm"><code>${esc(a.command || "")}</code></td><td>${esc(a.queue || "")}</td>
    <td><a href="#/tickets?assignee=${encodeURIComponent(a.name)}">${a.open_assigned}</a></td><td class="hide-sm muted">${ago(a.last_seen)}</td>
    <td class="right">${a.kind === "agent" && a.command ? `<button class="small" data-run="${esc(a.name)}">Run next</button>` : ""}<button class="small" data-edit="${esc(a.name)}">Edit</button></td></tr>`).join("")}
  </tbody></table>`;
};
function bindAgents() {
  const presets = current.presets;
  const edit = (a = {kind: "agent", enabled: 1}) => {
    const bg = modal(`<h2>${a.name ? "Edit " + esc(a.name) : a.kind === "agent" ? "New AI agent" : "New person"}</h2>
      <label>Name (used for @mentions)</label><input id="an" value="${esc(a.name || "")}" ${a.name ? "readonly" : ""}>
      <label>Kind</label><select id="ak">${["agent", "human"].map(k => opt(k, k, a.kind)).join("")}</select>
      <div id="agentOnly"><label>Preset</label><select id="ap">${opt("", "— custom —")}${Object.keys(presets).map(k => opt(k)).join("")}</select>
      <label>Command (prompt is sent on stdin; or use {prompt} / {prompt_file})</label><input id="ac" value="${esc(a.command || "")}">
      <label>Queue / group it pulls unassigned work from</label><input id="aq" value="${esc(a.queue || "")}">
      <label><input type="checkbox" id="ae" style="width:auto" ${a.enabled ? "checked" : ""}> Enabled for the background runner</label></div>
      <label>Capabilities (shown to other agents when they delegate)</label><input id="acap" value="${esc(a.capabilities || "")}" placeholder="e.g. planning, Python, frontend, research">
      <label>Description</label><textarea id="ad">${esc(a.description || "")}</textarea>`,
      [{label: "Save", cls: "primary", fn: async bg => { await api("/api/actors", {body: {name: $("#an", bg).value, kind: $("#ak", bg).value, command: $("#ac", bg).value,
        queue: $("#aq", bg).value, enabled: $("#ae", bg).checked ? 1 : 0, capabilities: $("#acap", bg).value, description: $("#ad", bg).value}}); await loadRefs(); render(); }}]);
    const sync = () => $("#agentOnly", bg).hidden = $("#ak", bg).value !== "agent";
    $("#ak", bg).onchange = sync; sync();
    $("#ap", bg).onchange = e => { if (presets[e.target.value]) { $("#ac", bg).value = presets[e.target.value]; if (!$("#an", bg).value) $("#an", bg).value = e.target.value; } };
  };
  $("#addAgent").onclick = () => edit();
  $("#addHuman").onclick = () => edit({kind: "human", enabled: 1});
  $$("[data-edit]").forEach(b => b.onclick = guard(async () => edit((await api("/api/actors")).find(a => a.name === b.dataset.edit))));
  $$("[data-run]").forEach(b => b.onclick = guard(async () => { await api(`/api/agents/${b.dataset.run}/run`, {body: {}}); toast(`${b.dataset.run} is picking up its next ticket`); setTimeout(render, 800); }));
}

views.projects = async () => {
  const rows = await api("/api/projects");
  return `<div class="row" style="justify-content:space-between"><h1>Projects</h1><button class="primary" id="addProj">+ Project</button></div>
  <p class="muted">A project groups tickets and tells agents which local folder (workspace) to work in.</p>
  <table><thead><tr><th>Key</th><th>Name</th><th>Workspace folder</th><th>Open</th><th>Done</th><th></th></tr></thead><tbody>
  ${rows.map(p => { const open = META.open_statuses.reduce((n, s) => n + (p.counts[s] || 0), 0), done = (p.counts.resolved || 0) + (p.counts.closed || 0);
    return `<tr><td><b>${p.key}</b></td><td>${esc(p.name)}<div class="muted">${esc(p.description)}</div></td><td><code>${esc(p.workspace)}</code></td>
    <td><a href="#/tickets?project=${p.key}">${open}</a></td><td>${done}</td><td class="right"><a href="#/board?project=${p.key}">Board</a> · <button class="small" data-edit="${p.key}">Edit</button></td></tr>`; }).join("") || '<tr><td colspan="6" class="empty">No projects yet.</td></tr>'}
  </tbody></table>`;
};
function bindProjects() {
  const edit = (p = {}) => modal(`<h2>${p.key ? "Edit " + p.key : "New project"}</h2><div class="two"><div><label>Key (e.g. WEB)</label><input id="pk" value="${esc(p.key || "")}" ${p.key ? "readonly" : ""}></div>
    <div><label>Name</label><input id="pn" value="${esc(p.name || "")}"></div></div><label>Workspace folder (absolute path on this machine)</label><input id="pw" value="${esc(p.workspace || "")}" placeholder="/home/me/code/website">
    <label>Description (given to agents as context)</label><textarea id="pd">${esc(p.description || "")}</textarea>`,
    [{label: "Save", cls: "primary", fn: async bg => { await api("/api/projects", {body: {key: $("#pk", bg).value, name: $("#pn", bg).value, workspace: $("#pw", bg).value, description: $("#pd", bg).value}}); await loadRefs(); render(); }}]);
  $("#addProj").onclick = () => edit();
  $$("[data-edit]").forEach(b => b.onclick = () => edit(PROJECTS.find(p => p.key === b.dataset.edit)));
}

views.help = async () => {
  const py = "python -m agentdesk";
  return `<h1>Connect a local AI</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr))">
  <div class="card md"><h2>1 · Let the runner drive agents (no setup in the AI)</h2>
  <p>Register an agent with the command that runs it. The prompt (full ticket briefing) is piped on stdin.</p>
  <pre><code>${py} agent add claude --preset claude --capabilities "planning, coding"
${py} agent add codex  --preset codex  --capabilities "coding, tests"
${py} agent add llama  --command "ollama run llama3.1" --capabilities "writing"
${py} run            # loop: every agent works its queue
${py} serve --runner # GUI + runner together</code></pre>
  <p>Plain-text models reply with a fenced <code>agentdesk</code> JSON block (status, subtasks, comments, kb); tool-using agents call the CLI themselves.</p></div>
  <div class="card md"><h2>2 · MCP (Claude Code, Codex, Cursor…)</h2>
  <pre><code>claude mcp add agentdesk -- ${py} mcp --actor claude

# ~/.codex/config.toml
[mcp_servers.agentdesk]
command = "python"
args = ["-m", "agentdesk", "mcp", "--actor", "codex"]</code></pre>
  <p>Tools: whoami, next_ticket, get_ticket, create_ticket, set_status, add_comment, attach_file, ask, kb_put, …</p></div>
  <div class="card md"><h2>3 · CLI (any agent that can run shell)</h2>
  <pre><code>export AGENTDESK_ACTOR=claude
${py} next                       # claim the next ticket

  <pre><code>curl -H "X-Actor: bot" localhost:8765/api/tickets?status=open
curl -H "X-Actor: bot" -d '{"title":"Hi","type":"task"}' localhost:8765/api/tickets</code></pre></div></div>`;
};

// ------------------------------------------------------------- router
const binders = {tickets: (a, p) => bindTickets(p), board: bindBoard, inbox: bindInbox, t: bindTicket, kb: bindKb, agents: bindAgents, projects: bindProjects, dashboard: bindRows, goals: () => {}};
async function render() {
  const [path, qs] = (location.hash.slice(2) || "dashboard").split("?");
  const [view, arg] = path.split("/");
  const params = new URLSearchParams(qs || "");
  current = {...current, view, arg, params};
  $$("#nav a").forEach(a => a.classList.toggle("active", a.dataset.v === view || (view === "t" && a.dataset.v === "tickets")));
  const fn = views[view] || views.dashboard;
  const scroll = window.scrollY, sameView = render.last === location.hash;
  const draft = $("#body")?.value;
  try {
    $("#view").innerHTML = await fn(arg, params);
    (binders[view] || (() => {}))(arg, params);
    if (sameView) { window.scrollTo(0, scroll); if (draft && $("#body")) $("#body").value = draft; } else window.scrollTo(0, 0);
  } catch (e) { $("#view").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  render.last = location.hash;
  refreshInbox();
}
async function refreshInbox() {
  try { const n = (await api("/api/inbox")).length; const el = $("#inboxCount"); el.hidden = !n; el.textContent = n; } catch {}
}
// Live updates: poll the event stream and re-render when something relevant changed.
async function poll() {
  try {
    const {last, events} = await api("/api/events?since=" + lastEvent);
    if (lastEvent && events.length) {
      const typing = document.activeElement && ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName) && document.activeElement.value;
      const relevant = current.view !== "t" || events.some(e => e.data.key === current.arg || e.data.src === current.arg || e.data.dst === current.arg);
      if (relevant && !typing && !$(".modal-bg")) render(); else refreshInbox();
    }
    lastEvent = last;
  } catch {}
  setTimeout(poll, 3000);
}

$("#search").onkeydown = e => { if (e.key === "Enter") location.hash = "#/tickets?status=all&q=" + encodeURIComponent(e.target.value); };
$("#newBtn").onclick = () => newTicket();
$("#newGoalBtn").onclick = () => newTicket("goal");
$("#actor").onchange = async e => {
  let v = e.target.value;
  if (v === "__new") { v = (prompt("Your name (used for @mentions):") || "").trim(); if (!v) return void (e.target.value = me); }
  me = v; store.set("ad.actor", me); await loadRefs(); render();
};
$("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; store.set("ad.theme", document.documentElement.dataset.theme); };
if (store.get("ad.theme")) document.documentElement.dataset.theme = store.get("ad.theme");
window.addEventListener("hashchange", render);
window.newTicket = newTicket;
(async () => { META = await api("/api/meta"); await loadRefs(); await render(); poll(); })();
</script>
