[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdesk"
version = "0.1.0"
description = "Local service-desk style ticket system for humans and AI agents (GUI, CLI, MCP, agent runner)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentdesk = "agentdesk.cli:main"

[tool.setuptools]
packages = ["agentdesk"]

[tool.setuptools.package-data]
agentdesk = ["static/*"]
